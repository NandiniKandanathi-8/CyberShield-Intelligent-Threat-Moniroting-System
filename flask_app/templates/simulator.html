
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield | Security Event Simulator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0369a1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
        }

        .message {
            text-align: center;
            color: #4ade80;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛡️ Security Event Simulator</h1>
        <p style="text-align:center;">Simulate login activity and monitor security threats.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('simulate_event') }}" method="POST">

            <label for="ip_address">IP Address</label>
            <input type="text" id="ip_address" name="ip_address"
                   placeholder="192.168.1.10" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" required>

            <label for="status">Login Status</label>
            <select id="status" name="status" required>
                <option value="">Select Login Status</option>
                <option value="Success">Success</option>
                <option value="Failed">Failed</option>
            </select>

            <button type="submit">Submit Security Event</button>
        </form>

        <a class="back" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
